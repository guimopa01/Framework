<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visor de PDF</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem clamp(1rem, 4vw, 2rem);
        background: #1f2937;
        border-bottom: 1px solid #374151;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .toolbar,
      .navigation {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }

      button {
        min-width: 2.75rem;
        min-height: 2.75rem;
        border: 1px solid #4b5563;
        border-radius: 0.5rem;
        background: #374151;
        color: inherit;
        font-size: 1.25rem;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #4b5563;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      #page-count {
        min-width: 6rem;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      main {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      #viewer {
        width: 100%;
        height: 100%;
        min-height: 15rem;
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        box-shadow: 0 0.5rem 2rem #0008;
      }

      #message {
        max-width: 36rem;
        padding: 1rem;
        color: #d1d5db;
        text-align: center;
      }

      footer {
        padding: 0.65rem 1rem;
        color: #9ca3af;
        font-size: 0.875rem;
        text-align: center;
      }

      @media (max-width: 600px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .toolbar {
          width: 100%;
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Elección Framework FrontEnd</h1>
      <div class="toolbar">
        <nav class="navigation" aria-label="Navegación de páginas">
          <button id="previous" type="button" aria-label="Página anterior" title="Página anterior (←)" disabled>←</button>
          <span id="page-count" aria-live="polite">Cargando PDF…</span>
          <button id="next" type="button" aria-label="Página siguiente" title="Página siguiente (→)" disabled>→</button>
        </nav>
      </div>
    </header>
    <main>
      <div id="viewer">
        <p id="message" role="status">Cargando el documento…</p>
        <canvas id="page" hidden></canvas>
      </div>
    </main>
    <footer>Usa las flechas ← → del teclado para cambiar de página.</footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      const pdfjsLib = window.pdfjsLib;
      const canvas = document.getElementById("page");
      const context = canvas.getContext("2d");
      const message = document.getElementById("message");
      const pageCount = document.getElementById("page-count");
      const previousButton = document.getElementById("previous");
      const nextButton = document.getElementById("next");
      let pdf;
      let currentPage = 1;
      let renderTask;
      let renderToken = 0;

      if (pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        loadPdf("Elección Framework FrontEnd.pdf");
      } else {
        showMessage("No se pudo cargar el visor PDF. Comprueba tu conexión e inténtalo de nuevo.");
      }

      async function loadPdf(source) {
        message.textContent = "Cargando documento…";
        canvas.hidden = true;
        previousButton.disabled = true;
        nextButton.disabled = true;

        try {
          const loadingTask = typeof source === "string"
            ? pdfjsLib.getDocument(source)
            : pdfjsLib.getDocument({ data: source });
          pdf = await loadingTask.promise;
          currentPage = 1;
          await renderPage();
        } catch (error) {
          console.error("No se pudo abrir el PDF:", error);
          showMessage("No se pudo abrir el PDF.");
        }
      }

      async function renderPage() {
        if (!pdf) return;

        const token = ++renderToken;
        if (renderTask) {
          renderTask.cancel();
          renderTask = null;
        }

        pageCount.textContent = `${currentPage} / ${pdf.numPages}`;
        previousButton.disabled = currentPage <= 1;
        nextButton.disabled = currentPage >= pdf.numPages;

        try {
          const page = await pdf.getPage(currentPage);
          if (token !== renderToken) return;

          const baseViewport = page.getViewport({ scale: 1 });
          const viewer = document.getElementById("viewer");
          const availableWidth = Math.max(1, viewer.clientWidth - 16);
          const availableHeight = Math.max(1, viewer.clientHeight - 16);
          const scale = Math.min(
            availableWidth / baseViewport.width,
            availableHeight / baseViewport.height
          );
          const viewport = page.getViewport({ scale });
          const pixelRatio = window.devicePixelRatio || 1;

          canvas.width = Math.floor(viewport.width * pixelRatio);
          canvas.height = Math.floor(viewport.height * pixelRatio);
          canvas.style.width = `${viewport.width}px`;
          canvas.style.height = `${viewport.height}px`;
          canvas.hidden = false;
          message.hidden = true;

          renderTask = page.render({
            canvasContext: context,
            viewport,
            transform: pixelRatio === 1 ? null : [pixelRatio, 0, 0, pixelRatio, 0, 0]
          });
          await renderTask.promise;
        } catch (error) {
          if (error.name !== "RenderingCancelledException") {
            console.error("No se pudo mostrar la página:", error);
            showMessage("No se pudo mostrar esta página.");
          }
        } finally {
          if (token === renderToken) renderTask = null;
        }
      }

      function showMessage(text) {
        message.textContent = text;
        message.hidden = false;
        canvas.hidden = true;
        pageCount.textContent = pdf ? `${currentPage} / ${pdf.numPages}` : "PDF no disponible";
      }

      function changePage(amount) {
        if (!pdf) return;
        const nextPage = Math.min(pdf.numPages, Math.max(1, currentPage + amount));
        if (nextPage === currentPage) return;
        currentPage = nextPage;
        renderPage();
      }

      previousButton.addEventListener("click", () => changePage(-1));
      nextButton.addEventListener("click", () => changePage(1));
      window.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        changePage(event.key === "ArrowRight" ? 1 : -1);
      });
      window.addEventListener("resize", () => renderPage());

    </script>
  </body>
</html>
